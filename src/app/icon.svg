<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Cuadrado redondeado en el terracota oscuro de la marca, con la inicial
       en crema. A 16px una sola letra es lo único que se lee: el logotipo
       completo "BITHIA" quedaría en una mancha. -->
  <rect width="32" height="32" rx="7" fill="#b08a70"/>
  <text x="16" y="17"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="19"
        font-weight="700"
        letter-spacing="0.5"
        fill="#faf8f7">B</text>
</svg>
